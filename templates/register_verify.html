{% extends "base.html" %}
{% block title %}{{ t('reg_verify_title') }} — {{ t('app_name') }}{% endblock %}
{% block body %}
<div class="page page-narrow">
  <div class="section-title"><h2>{{ t('reg_verify_title') }}</h2></div>
  <p>{{ t('reg_verify_body') }}</p>

  <div class="card">
    <form method="POST">
      <label for="phone_otp">{{ t('phone_otp_label') }} — {{ pending.phone }}</label>
      <div style="display:flex; gap:10px; align-items:flex-end;">
        <input type="text" id="phone_otp" name="phone_otp" inputmode="numeric" autocomplete="one-time-code"
               pattern="[0-9]{6}" maxlength="6" placeholder="••••••" required style="flex:1;">
        <button type="submit" name="action" value="resend_phone" formnovalidate class="btn btn-ghost btn-sm">{{ t('btn_resend') }}</button>
      </div>

      <label for="email_otp">{{ t('email_otp_label') }} — {{ pending.email }}</label>
      <div style="display:flex; gap:10px; align-items:flex-end;">
        <input type="text" id="email_otp" name="email_otp" inputmode="numeric" autocomplete="one-time-code"
               pattern="[0-9]{6}" maxlength="6" placeholder="••••••" required style="flex:1;">
        <button type="submit" name="action" value="resend_email" formnovalidate class="btn btn-ghost btn-sm">{{ t('btn_resend') }}</button>
      </div>

      <div style="margin-top:22px;">
        <button type="submit" class="btn btn-primary btn-block">{{ t('btn_verify_create') }}</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
