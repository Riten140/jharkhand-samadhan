<form class="lang-switch" onchange="window.location.href = this.action + this.langsel.value;" action="{{ url_for('set_language', code='') }}">
  <select name="langsel" aria-label="{{ t('language') }}">
    {% for code, native, english, group, fb in LANGUAGES %}
    <option value="{{ code }}" {{ 'selected' if code == current_lang_code }}>{{ native }}</option>
    {% endfor %}
  </select>
</form>
