<!DOCTYPE html>
<html lang="{{ current_lang_code|default('en') }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#163B2E">
<title>{% block title %}Jharkhand Samadhan{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
{% block head_extra %}{% endblock %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=3">
</head>
<body>
{% include "_header.html" %}
{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
  <div class="flash">
    {% for category, msg in messages %}
      <div class="flash-msg flash-{{ 'error' if category=='error' else 'success' }}">{{ msg }}</div>
    {% endfor %}
  </div>
  {% endif %}
{% endwith %}
{% block body %}{% endblock %}
<script src="{{ url_for('static', filename='js/main.js') }}?v=3"></script>
{% block scripts %}{% endblock %}
</body>
</html>
